version: "3.8"

services:
  # Backend FastAPI
  backend:
    build: ./backend-fastapi
    container_name: backend_app
    expose:
      - "8001"
    environment:
      - DATABASE_URL=mysql+pymysql://user:rootpassword@mysql_db:3306/database_ilyas_nahi
    depends_on:
      - mysql_db
    volumes:
      - ./backend-fastapi:/app
    command: ["/wait-for-it.sh", "mysql_db", "3306", "--", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  # Base de données MySQL
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql

  # Nginx pour servir React et proxy FastAPI
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx_app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - webroot:/var/www/html:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - backend

  # Certbot pour SSL Let's Encrypt
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - webroot:/var/www/html
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - nginx
    command: >
      certonly --webroot --webroot-path=/var/www/html
      --email admin@e-learning-by-ilyas.com
      --agree-tos --no-eff-email
      -d e-learning-by-ilyas.com -d www.e-learning-by-ilyas.com

# Volumes persistants
volumes:
  db_data:
  webroot:
  certbot-etc:
  certbot-var:
