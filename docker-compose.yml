services:
  backend:
    build: ./backend-fastapi
    container_name: fastapi_app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://user:rootpassword@db:3306/database_ilyas_nahi
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "80:80" 
    volumes: 
      - webroot:/usr/share/nginx/html
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - .env  
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - webroot:/var/www/html
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - frontend
    command: certonly --webroot --webroot-path=/var/www/html --email yassine.elbarni12@email.com --agree-tos --no-eff-email -d e-learning-by-ilyas.com -d www.e-learning-by-ilyas.com


volumes:
  db_data:
  webroot:
  certbot-etc:
  certbot-var: