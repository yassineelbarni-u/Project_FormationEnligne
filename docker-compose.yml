services:
  backend:
    build: ./backend-fastapi
    container_name: fastapi_app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://user:rootpassword@db:3306/database_ilyas_nahi
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: database_ilyas_nahi
      MYSQL_USER: user
      MYSQL_PASSWORD: rootpassword
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
