version: "3.8"

services:
  backend:
    build: ./backend-fastapi
    # pas d'exposition publique; Nginx proxy vers ce service
    expose:
      - "8001"
    environment:
      # utiliser le nom du service DB
      - DATABASE_URL=mysql+pymysql://USER:PASS@mysql_db:3306/DBNAME
    depends_on:
      - mysql_db

  mysql_db:
    image: mysql:8.0
    restart: always
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    # pas nécessaire d'exposer 3306 publiquement en prod

nginx:
  build:
    context: ./frontend
    dockerfile: Dockerfile
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - webroot:/var/www/html:ro
    - certbot-etc:/etc/letsencrypt:ro
  depends_on:
    - backend

  certbot:
    image: certbot/certbot:latest
    volumes:
      - webroot:/var/www/html
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - nginx
    # commande non-interactive webroot (pas d’EOF)
    command: >
      certonly --webroot --webroot-path=/var/www/html
      --email admin@e-learning-by-ilyas.com
      --agree-tos --no-eff-email
      -d e-learning-by-ilyas.com -d www.e-learning-by-ilyas.com

volumes:
  db_data:
  webroot:
  certbot-etc:
  certbot-var:
