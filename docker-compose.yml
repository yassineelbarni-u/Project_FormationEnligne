services:
  backend:
    build: ./backend-fastapi
    container_name: fastapi_app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://user:rootpassword@db:3306/database_ilyas_nahi
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "3000:80"
    volumes:
      - webroot:/usr/share/nginx/html
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: database_ilyas_nahi
      MYSQL_USER: user
      MYSQL_PASSWORD: rootpassword
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var//libmysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - webroot:/var/www/html
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - frontend
    command: certonly --webroot --webroot-path=/var/www/html --email ton@email.com --agree-tos --no-eff-email -d ton-domaine.com

volumes:
  db_data:
  webroot:
  certbot-etc:
  certbot-var: