version: '3.9'

services:
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile.dev
    container_name: fastapi_app
    working_dir: /app
    volumes:
      - ./backend-fastapi:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://user:rootpassword@db:3306/database_ilyas_nahi
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: react_app
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm start
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: database_ilyas_nahi
      MYSQL_USER: user
      MYSQL_PASSWORD: rootpassword
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
