# Serveur HTTP pour ACME challenge + redirection vers HTTPS
server {
    listen 80;
    server_name e-learning-by-ilyas.com www.e-learning-by-ilyas.com;

    # ACME challenge pour Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirection de tout le reste vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS
server {
    listen 443 ssl;
    server_name e-learning-by-ilyas.com www.e-learning-by-ilyas.com;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/e-learning-by-ilyas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-learning-by-ilyas.com/privkey.pem;

    # Servir la SPA React
    root /usr/share/nginx/html;
    index index.html;

    # Proxy vers l’API FastAPI
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Routes SPA React (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Statiques explicites (CSS, JS, images, fonts)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fichiers uploadés
    location /uploads/ {
        root /usr/share/nginx/html;
    }
}
