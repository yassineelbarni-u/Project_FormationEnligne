server {
  listen 443 ssl;
  server_name e-learning-by-ilyas.com www.e-learning-by-ilyas.com;
  ssl_certificate /etc/letsencrypt/live/e-learning-by-ilyas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/e-learning-by-ilyas.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://fastapi_app:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri /index.html;
  }
}
