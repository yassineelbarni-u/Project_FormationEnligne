# =========================
# REDIRECTION HTTP -> HTTPS
# =========================
server {
    listen 80;
    server_name e-learning-by-ilyas.com www.e-learning-by-ilyas.com;

    # Let's Encrypt challenge pour la validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirection tout le reste vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# SERVEUR HTTPS
# =========================
server {
    listen 443 ssl;
    server_name e-learning-by-ilyas.com www.e-learning-by-ilyas.com;

    # Certificats SSL générés par Certbot
    ssl_certificate /etc/letsencrypt/live/e-learning-by-ilyas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-learning-by-ilyas.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # FRONTEND REACT
    # =========================
    location / {
        try_files $uri /index.html;
    }

    # =========================
    # BACKEND FASTAPI
    # =========================
    location /api/ {
        proxy_pass http://fastapi_app:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================
    # FICHIERS STATIQUES
    # =========================
    location /assets/ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    location /videos/ {
        try_files $uri =404;
    }

    # Page 404 React
    error_page 404 /index.html;
}
